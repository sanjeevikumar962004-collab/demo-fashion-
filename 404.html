<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .font-serif-luxury { font-family: 'Playfair Display', serif; }
        .text-outline { color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,0.4); }
        .text-outline-thick { color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,0.2); }
        
        .noise {
            position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glitch-reveal { animation: glitchReveal 1.5s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes glitchReveal {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        
        /* Subtle float animation */
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: subtle-float 8s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden">
    <div class="noise"></div>

    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
        <img src="assets/images/blog hero.webp" class="w-full h-full object-cover opacity-20 scale-105 animate-float" alt="Abstract Fabric" />
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Top Nav (Minimal) -->
    <header class="absolute top-0 w-full px-8 md:px-16 py-8 flex justify-between items-center z-20">
        <a href="index.html" class="flex items-center text-white select-none" aria-label="stackly home">
            <img src="assets/images/stackly logo.webp" alt="stackly." class="h-8 w-auto object-contain brightness-0 invert" />
        </a>
        <a href="login.html" class="text-xs font-bold uppercase tracking-widest text-white/60 hover:text-white transition-colors">Login</a>
    </header>

    <!-- Content -->
    <div class="relative z-10 text-center px-6 max-w-4xl w-full glitch-reveal">
        <p class="text-[10px] md:text-xs uppercase tracking-[0.3em] font-bold text-white/40 mb-6">Error 404</p>
        
        <h1 class="font-black uppercase leading-[0.8] tracking-tighter relative select-none mb-12">
            <span class="block text-[120px] sm:text-[180px] md:text-[240px] lg:text-[300px] text-outline-thick -mb-6 sm:-mb-12 md:-mb-16">404</span>
            <span class="block text-4xl sm:text-6xl md:text-7xl font-serif-luxury italic font-light tracking-tight absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full text-white">
                Missing Thread.
            </span>
        </h1>
        
        <p class="text-white/60 text-sm md:text-base max-w-lg mx-auto leading-relaxed mb-12 font-light">
            The page you are looking for has been moved, removed, or never existed in our catalogue. Let us guide you back to the collection.
        </p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
            <a href="index.html" class="group flex items-center justify-center gap-3 bg-white text-black px-10 py-4 w-full sm:w-auto text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-colors">
                Return to Runway
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="group-hover:-translate-x-1 transition-transform"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <a href="products.html" class="group flex items-center justify-center gap-3 border border-white/30 text-white px-10 py-4 w-full sm:w-auto text-xs font-bold uppercase tracking-widest hover:border-white transition-colors">
                Browse Collection
            </a>
        </div>
    </div>

    <!-- Bottom Footer (Minimal) -->
    <div class="absolute bottom-8 w-full px-8 md:px-16 flex justify-between items-center z-20 text-white/30 text-[10px] uppercase tracking-widest font-semibold">
        <span>© 2026 stackly.</span>
        <span>Salem Atelier</span>
    </div>
</body>
</html>
